<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    .bg { fill: #09090B; stroke: #27272A; }
    .star { fill: url(#goldGrad); filter: url(#glow); }
    .center-sparkle { fill: #FEF3C7; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #FFFBEB; stroke: #FDE68A; }
      .star { fill: url(#goldGrad); }
      .center-sparkle { fill: #FFFFFF; }
    }
  </style>
  <!-- Squircle Base -->
  <rect class="bg" x="4" y="4" width="56" height="56" rx="16" stroke-width="2" />
  
  <!-- Auspicious 8-Point Fortune Star / Lotus Flower Motif -->
  <!-- Vertical & Horizontal Petals -->
  <path class="star" d="M32 12 C32 20, 24 28, 16 28 C24 28, 32 36, 32 44 C32 36, 40 28, 48 28 C40 28, 32 20, 32 12 Z" transform="translate(0, 4)" />
  
  <!-- Diagonal Petals -->
  <path class="star" opacity="0.85" d="M32 15 C32 21, 26 27, 20 27 C26 27, 32 33, 32 39 C32 33, 38 27, 44 27 C38 27, 32 21, 32 15 Z" transform="rotate(45 32 32)" />
  
  <!-- Central Sparkle Diamond -->
  <polygon class="center-sparkle" points="32,26 34.5,32 32,38 29.5,32" />
  <polygon class="center-sparkle" points="26,32 32,34.5 38,32 32,29.5" />
  <circle cx="32" cy="32" r="1.5" fill="#FFFFFF" />
</svg>
